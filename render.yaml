services:
  # ─── Backend: Render Web Service ──────────────────────────────────────────
  - type: web
    name: adse-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        fromService:
          type: web
          name: adse-frontend
          property: host

  # ─── Frontend: Render Static Site ─────────────────────────────────────────
  - type: web
    name: adse-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: adse-backend
          property: host
